[package]
name = "brine-ed25519"
version = "0.9.2"
edition = "2021"
description = "Ed25519 signature verification for Solana SVM programs using curve25519 syscalls"
license = "MIT"
repository = "https://github.com/zfedoran/brine-ed25519"
readme = "README.md"
keywords = ["solana", "ed25519", "signature", "no_std", "curve25519"]
categories = ["cryptography", "no-std", "wasm", "embedded"]

[lib]
crate-type = ["lib"]

[features]
# Opt out of the `sol_sha512` syscall and hash the challenge in-program
# (using the hand-rolled FastSha512). For clusters/SVM runtimes where
# SIMD-0512 is not active. Enabling this anywhere in the dependency tree
# opts the whole program out of the syscall. Same feature name as 0.8.x,
# so existing Cargo.toml entries keep working.
fast-sha512 = []
# No-op: the syscall is the default since 0.9. Kept so 0.8.x feature
# lists still resolve.
sha512-syscall = []

[dependencies]
sha2 = { version = "0.10.8", default-features = false }
solana-address = { version = "2.2.0", default-features = false }
solana-program-error = { version = "3.0.1", default-features = false }

[target.'cfg(any(target_arch = "bpf", target_os = "solana"))'.dependencies]
solana-define-syscall = "5.2.0"

[target.'cfg(all(not(target_arch = "bpf"), not(target_os = "solana")))'.dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false }

[dev-dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false }
rand = { version = "0.8.5", default-features = false, features = ["std", "std_rng"] }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(target_os, values("solana"))']
